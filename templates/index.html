<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuickSummary</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
</head>

<body>
  <div class="vertical-strip bg-black text-white text-center fixed-top d-flex justify-content-between">
    <div><span>Developed by: Sachin Yadav</span></div>
    <div class="m-0">Summarize your text</div>
    <div class='d-flex flex-row-reverse'>
<div class='me-1'><a href="https://github.com/sachin2967" target="_blank" rel="noopener noreferrer"> GitHub </a></div>
    </div>
  </div>
  <!-- <div class="mb-3">
  <label for="exampleFormControlTextarea1" class="form-label">{{data}}</label>
  <textarea class="card"  rows="3">{{data}}</textarea>
</div> -->

  <div class="row mt-5">
    <div class="col-sm-6 mb-3 mb-sm-0">
      <div class="card d-flex flex-column">
        <div class="card-body">
          {% if error %}<div class="alert alert-warning" role="alert" aria-live="polite">{{ error }}</div>{% endif %}
          <form method="POST" action="{{url_for('index')}}">
            <div class="mb-3">
              <textarea class="form-control" name="text" placeholder="Enter your text" id="inputText"
                rows="18" required>{{ text or '' }}</textarea>
            </div>
            <div class="d-grid gap-2 d-md-flex justify-content-md-center">
              <div><label for="maxLength" class="form-label">Summary length (50-1000 model tokens)</label></div>
              <div><input type="range" id="maxLength" name="maxL" min="50" max="1000" step="10" value="{{ maxL or 150 }}" oninput="document.getElementById('lengthValue').textContent=this.value"></div>
              <output id="lengthValue" for="maxLength">{{ maxL or 150 }}</output>
            </div>
            <div class="d-flex flex-row justify-content-center">
              <div><button type="submit" class="btn btn-success m-2 px-4" id="submitButton">Submit</button></div>
              <div><button type="reset" class="btn btn-danger m-2 px-4" id="clearButton">Clear </button></div>
            </div>
          </form>
        </div>
      </div>
    </div>
    <div class="col-sm-6">
      <div class="card">
        <div class="card-body">
          <textarea class="form-control" id="myInput" rows="20" placeholder="Your summary will appear here" readonly>{{ data or '' }}</textarea>
        </div>
        <div class="center"><button class="btn btn-primary d-grid gap-2 mx-auto my-4" type="button" onclick="copySummary()">Copy text</button></div>
      </div>
    </div>
  </div>
  <script>
    async function copySummary() {
      const output = document.getElementById("myInput");
      if (!output.value.trim()) return;
      try {
        await navigator.clipboard.writeText(output.value);
      } catch (error) {
        output.focus();
        output.select();
        document.execCommand("copy");
      }
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
    crossorigin="anonymous"></script>
</body>

</html>
